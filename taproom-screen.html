<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On Tap @ HGB — Taproom Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Oswald:wght@500;600;700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  /* Palette from hazelgrovebrewing.com / brand guide */
  :root {
    --sage: #D9DBB2;      /* site background (brand "light green") */
    --green: #307055;     /* brand green — headings */
    --charcoal: #2E2B28;  /* brand charcoal — beer names */
    --cream: #F7EFE2;
    --light-green: #D9DBB2; /* brand light green — titles, headers, logo */
    --red: #E2493E;
    --yellow: #EFCB69;
    --scale: 1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--charcoal);
    color: var(--cream);
    font-family: "Almarai", Helvetica, Arial, sans-serif;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 2.2vh 3vw 1.6vh;
    cursor: none;
  }
  header { text-align: center; }
  header h1 {
    font-family: "Yellowtail", cursive;
    font-weight: 400;
    color: var(--light-green);
    font-size: 8vh;
    line-height: 1.1;
  }
  header .rule {
    width: 18vw; height: 0.45vh; margin: 0.6vh auto 0;
    background: var(--light-green); border-radius: 1vh;
  }

  #box { position: relative; min-height: 0; overflow: hidden; margin-top: 2vh; }
  #menu {
    column-count: 3;
    column-gap: 4vw;
    column-fill: balance;
    font-size: calc(2.2vh * var(--scale) * 1.6);
  }
  .cat { break-inside: avoid; margin-bottom: 1.1em; }
  .cat h2 {
    font-family: "Yellowtail", cursive;
    font-weight: 400;
    color: var(--light-green);
    font-size: 1.55em;
    line-height: 1.15;
    margin-bottom: .25em;
    border-bottom: .08em solid rgba(217,219,178,.7);
    padding-bottom: .1em;
  }
  .beer { break-inside: avoid; padding: .35em 0 .3em; }
  .beer .top { display: flex; align-items: baseline; gap: .5em; }
  .beer .name {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-style: italic;
    letter-spacing: .01em;
    font-size: 1.12em;
    line-height: 1.1;
    flex: 1;
  }
  .beer .price { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 1.05em; color: var(--cream); }
  .beer .pack { font-family: "Oswald", sans-serif; font-weight: 600; font-size: .8em; color: var(--cream); white-space: nowrap; }
  .beer .pack small { font-size: .7em; letter-spacing: .05em; }
  .beer .style {
    text-transform: uppercase;
    font-size: .62em;
    letter-spacing: .06em;
    margin-top: .2em;
  }
  .beer .abv { font-weight: 800; color: var(--cream); white-space: nowrap; }
  .beer .desc { font-size: .6em; margin-top: .2em; opacity: .9; font-style: italic; }
  .beer .serving { font-size: calc(.62em * .75); font-style: italic; margin-top: .25em; letter-spacing: .03em; }

  footer {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 3vw; margin-top: 1vh;
  }
  footer .note {
    font-family: "Oswald", sans-serif; font-weight: 500;
    text-transform: uppercase; letter-spacing: .08em;
    font-size: 2.1vh; color: var(--cream);
  }
  footer .logo { height: 10vh; width: auto; display: block; }

  #status {
    position: fixed; left: 1vw; top: .8vh; font-size: 1.3vh;
    color: var(--cream); opacity: .6;
  }
  #status.err { color: var(--yellow); opacity: 1; }

  /* VW bug drive-by: hidden and idle except during its run */
  #bug { position: fixed; left: 0; top: 0; pointer-events: none; visibility: hidden; z-index: 5; }
  #bug .car { position: absolute; inset: 0; transform-origin: 50% 100%; }
  #bug .body { display: block; width: 100%; height: 100%; }
  /* rim rings cut from the same art; they spin while the hubcap chrome stays put */
  #bug .rim { position: absolute; top: 67.83%; width: 12.301%; height: 25%; }
  #bug .rim.rear { left: 15.962%; }
  #bug .rim.front { left: 76.23%; }
  /* HGB badge on the driver's door (brand green on the cream door panel) */
  #bug .badge { position: absolute; left: 50.6%; top: 53%; width: 10.4%; height: auto; }
  /* Community sign-up screen: fades in over the menu for 30s every 4 minutes */
  #promo {
    position: fixed; inset: 0; z-index: 10;
    background: var(--charcoal); color: var(--cream);
    padding: 5vh 5vw 3vh;
    display: grid; grid-template-rows: auto 1fr auto;
    opacity: 0; visibility: hidden;
    transition: opacity 1.2s ease, visibility 0s linear 1.2s;
  }
  #promo.show { opacity: 1; visibility: visible; transition: opacity 1.2s ease, visibility 0s; }
  #promo header h1 { font-size: 11vh; }
  #promo header .rule { width: 26vw; margin-top: 3vh; }
  #promo .sub {
    font-size: 4.2vh; line-height: 1.3; text-align: center;
    max-width: 75vw; margin: 3vh auto 0;
  }
  #promo .lower {
    display: grid; grid-template-columns: 1fr 1fr; align-items: center;
    gap: 5vw; padding: 0 2vw; min-height: 0;
  }
  #promo .join { display: flex; flex-direction: column; align-items: center; gap: 2vh; }
  #promo .join img { height: 36vh; width: auto; display: block; border-radius: 1.2vh; }
  #promo .join span {
    font-family: "Oswald", sans-serif; font-weight: 700; text-transform: uppercase;
    letter-spacing: .12em; font-size: 5vh; color: var(--light-green);
  }
  #promo .perks h2 {
    font-family: "Yellowtail", cursive; font-weight: 400; color: var(--light-green);
    font-size: 6vh; line-height: 1.1; margin-bottom: 1.5vh;
  }
  #promo .perks ul { list-style: none; font-size: 3.8vh; line-height: 1.3; }
  #promo .perks li { position: relative; padding-left: 1.4em; margin-bottom: 1.4vh; }
  #promo .perks li::before {
    content: ""; position: absolute; left: .2em; top: .45em;
    width: .45em; height: .45em; border-radius: 50%; background: var(--light-green);
  }
  #promo .perks strong { font-family: "Oswald", sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  #promo footer { justify-content: flex-end; }

  #bug .shadow {
    position: absolute; left: 4%; right: 4%; bottom: -2.5%; height: 7%;
    background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0));
  }
</style>
</head>
<body>
  <header>
    <h1>On Tap @ HGB</h1>
    <div class="rule"></div>
  </header>

  <div id="box"><div id="menu"></div></div>

  <footer>
    <div class="note">Additional can pours available &mdash; ask your bartender</div>
    <img class="logo" src="assets/logo-horizontal-light-green.svg" alt="Hazel Grove Brewing">
  </footer>

  <section id="promo" aria-hidden="true">
    <header>
      <h1>Join the Hazel Grove Community</h1>
      <div class="rule"></div>
      <p class="sub">Sign up for free and check in when you visit for some great perks!</p>
    </header>
    <div class="lower">
      <div class="join">
        <img src="assets/community-qr.svg" alt="QR code to join the Hazel Grove community">
        <span>Join Today</span>
      </div>
      <div class="perks">
        <h2>Including</h2>
        <ul>
          <li>A free <strong>HGB draft beer</strong> on every 7th visit</li>
          <li>A free <strong>HGB four pack</strong> on your 25th visit</li>
          <li>And more!</li>
        </ul>
      </div>
    </div>
    <footer>
      <img class="logo" src="assets/logo-horizontal-light-green.svg" alt="Hazel Grove Brewing">
    </footer>
  </section>

  <div id="status"></div>
  <div id="bug" aria-hidden="true">
    <div class="shadow"></div>
    <div class="car">
      <img class="body" src="assets/vw-bug.webp" alt="">
      <img class="badge" src="assets/badge-door-green.svg" alt="">
      <img class="rim rear" src="assets/wheel-rear.webp" alt="">
      <img class="rim front" src="assets/wheel-front.webp" alt="">
    </div>
  </div>

<script>window.HGB_BUILD = "20261123-1";</script>
<script src="menu-data.js?v=20261123-1"></script>
<script>
  const menuEl = document.getElementById("menu");
  const boxEl = document.getElementById("box");
  const statusEl = document.getElementById("status");
  let lastHTML = "";

  function render(groups) {
    return groups.map(g => `
      <section class="cat">
        <h2>${escapeHTML(g.name)}</h2>
        ${g.beers.map(b => `
          <div class="beer">
            <div class="top">
              <div class="name">${escapeHTML(b.name)}</div>
              ${b.price ? `<div class="price">${escapeHTML(b.price)}</div>` : ""}
              ${b.fourPack ? `<div class="pack"><small>4PK</small> ${escapeHTML(b.fourPack)}</div>` : ""}
            </div>
            <div class="style">${escapeHTML(b.style)}${b.style && b.abv ? " &middot; " : ""}${b.abv ? `<span class="abv">${escapeHTML(b.abv)}</span>` : ""}</div>
            ${b.serving ? `<div class="serving">${escapeHTML(b.serving)}</div>` : ""}
            ${b.description ? `<div class="desc">${escapeHTML(b.description)}</div>` : ""}
          </div>`).join("")}
      </section>`).join("");
  }

  function fit() {
    // Fewer columns when the list is short so it fills the screen nicely
    const count = menuEl.querySelectorAll(".beer").length;
    menuEl.style.columnCount = count <= 6 ? 2 : 3;
    fitToBox(menuEl, boxEl, { min: 30, max: 140 });
  }

  async function refresh() {
    if (await reloadIfNewVersion()) return;
    const { groups, source, error } = await loadMenu();
    const html = render(groups);
    if (html !== lastHTML) { menuEl.innerHTML = html; lastHTML = html; fit(); }
    const t = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    statusEl.className = error ? "err" : "";
    statusEl.textContent =
      source === "sheet" ? "" :
      source === "cache" ? `Offline — showing last saved menu (${error})` :
      source === "none" ? `Can't reach the menu sheet: ${error}` :
      error ? `Couldn't load Google Sheet: ${error} — showing sample menu` :
      "Sample menu — connect your Google Sheet in menu-data.js";
  }

  /* VW bug drives left-to-right below the lowest beer every 2 minutes. It runs
     ~14s, then sits hidden until the next run, so the screen is idle in between.
     Animations are transform-only (GPU-composited). Add ?bounce=test to the
     URL to see it every 20 seconds. */
  const bug = document.getElementById("bug");
  const car = bug.querySelector(".car");
  const rims = bug.querySelectorAll(".rim");
  const BUG_RATIO = 800 / 394;                          // width / height of vw-bug.webp
  const TIRE_RADIUS = 158 / 1756;                       // tire radius as a share of car width
  function driveBug(then) {
    if (document.hidden) return;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { if (then) then(); return; }
    const vh = innerHeight / 100;
    let lowest = 0;
    menuEl.querySelectorAll(".beer").forEach(b => { lowest = Math.max(lowest, b.getBoundingClientRect().bottom); });
    const road = innerHeight - 1.2 * vh;                // where the tires sit
    const lane = road - (lowest + 1.2 * vh);            // free space under the lowest beer
    const h = Math.max(6 * vh, Math.min(16 * vh, lane));
    const w = h * BUG_RATIO;
    bug.style.width = w + "px";
    bug.style.height = h + "px";
    bug.style.top = (road - h) + "px";
    bug.style.visibility = "visible";

    const duration = 14000;
    const distance = innerWidth + w;
    const drive = bug.animate([{ transform: `translateX(${-w}px)` }, { transform: `translateX(${innerWidth}px)` }],
                              { duration, easing: "linear" });
    // wheels turn exactly as far as the car travels, so they roll instead of skid
    const turns = distance / (TIRE_RADIUS * w) * 180 / Math.PI;
    rims.forEach(r => r.animate([{ transform: "rotate(0deg)" }, { transform: `rotate(${turns}deg)` }],
                                { duration, easing: "linear" }));
    // a little suspension bounce while it drives
    const b = h * 0.012;
    car.animate([
      { transform: "translateY(0) rotate(0deg)" },
      { transform: `translateY(${-b}px) rotate(-0.4deg)` },
      { transform: "translateY(0) rotate(0deg)" },
      { transform: `translateY(${-b * 0.6}px) rotate(0.3deg)` },
      { transform: "translateY(0) rotate(0deg)" },
    ], { duration: 900, iterations: Math.ceil(duration / 900), easing: "ease-in-out" });
    drive.onfinish = () => {
      bug.style.visibility = "hidden";
      bug.getAnimations({ subtree: true }).forEach(a => a.cancel());
      if (then) then();
    };
  }

  /* Every other bug run (so every 4 minutes), the community sign-up screen
     fades in right after the bug leaves, stays 30 seconds, then fades out. */
  const promo = document.getElementById("promo");
  const PROMO_MS = 30000;
  function showPromo() {
    promo.classList.add("show");
    setTimeout(() => promo.classList.remove("show"), PROMO_MS);
  }
  let runs = 0;
  const driveEvery = new URLSearchParams(location.search).get("bounce") === "test" ? 20000 : 120000;
  setInterval(() => {
    if (promo.classList.contains("show")) return;     // never drive over the sign-up screen
    runs++;
    driveBug(runs % 2 === 0 ? showPromo : null);
  }, driveEvery);
  if (new URLSearchParams(location.search).get("promo") === "show") promo.classList.add("show"); // preview it

  document.fonts.ready.then(refresh);
  window.addEventListener("resize", fit);
  setInterval(refresh, MENU_CONFIG.REFRESH_MINUTES * 60 * 1000);
</script>
</body>
</html>
